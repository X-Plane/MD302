; Mid-Continent MD302 Standby Attitude Module (xLua 2.0 / Panel Graphics)
; Copyright (c) 2026 Tiezheng Eric Xu, erix@x-plane.com, Laminar Research - MIT License, see LICENSE
; Lines: key = value. ';' or '#' at the start of a line or after a space
; start a comment. Unknown keys are ignored (and reported in Log.txt as
; "[MD302 XLua2] config.ini: unknown key").
;
; This file is the unit's memory. The unit rewrites single lines in it:
;   [Options]  when the pilot picks a value in the Options Menu (manual 4.3.2)
;   [Configure ...] (all but dimming_rheostat): on ACCEPT CHANGES in
;              Configuration Mode (manual 4.5: hold the knob while aircraft
;              power comes on, or push and hold it 3.5 s on the start-up
;              screen, on the ground on aircraft power; or the command
;              laminar/md302/config_mode)
;   [State]    battery charge and run time
; [Power] [Sources] [Display] [Clicks] and dimming_rheostat are the aircraft
; author's and only read (ACCEPT CHANGES writes baro_sync_source back, unchanged,
; only when CONFIGURE BARO SYNC was changed). A value out of range is reported in
; Log.txt and clamped to the nearest allowed value.
; Manual: Installation Manual and Operating Instructions 9017782 rev Q (2024);
; the section numbers below are rev Q's.

[Options]
; The pilot's Options Menu (4.3.2): push and hold the knob 2 s. A value picked
; in the menu is saved on this line at once and is back after a reload.
alt_units = feet          ; feet | meters
baro_units = inhg         ; inhg | hpa (MBAR)
symbol = delta            ; delta | split_delta | traditional
att_mask = off            ; off | on
alt_trend = on            ; on | off

[State]
; written by the unit (power off, unload, new flight, every 5 minutes)
battery_pct = 100
run_time_h = 0

[Power]
; sim/cockpit2/electrical/bus_volts index (0..5) that feeds the unit, and the lowest
; volts it runs on (10-32 VDC input, rev Q 1.2)
power_bus = 0
power_min_volts = 10
; the unit's battery (rev Q 1.2, table 3.2): 1 = Type 1 lithium-ion 1.0 Ah
; (6420302-1, -4) | 2 = Type 2 nickel metal hydride 2.0 Ah (-7, -8; about 145
; minutes when new, set battery_minutes) | none = no battery (-2, -3, -5, -6):
; off as soon as aircraft power is lost, no battery icon, no battery check
battery_type = 1
; internal battery: minutes of operation from full (manual: at least 1 hour,
; up to 2.5 hours when new) and minutes to recharge from empty; less than 60
; minutes left at power-up: the battery warning (rev Q 5.1.3)
battery_minutes = 120
battery_charge_minutes = 180
; low battery icon below this charge (4.4.1)
battery_low_pct = 20
; pre-flight (start-up) screen, s (4.2: about 5 s); a push on it is also the
; way into Configuration Mode, so keep it a few seconds long
preflight_s = 5
; on the ground with aircraft power lost and AUTO-OFF on: countdown before it
; turns off (4.4.2)
power_down_countdown_s = 60
; AUTO-OFF (4.4.2) counts down with no airspeed: below ground_ias_kt (taxiing
; too). Configuration Mode needs "on the ground": below both
ground_speed_kt = 5
ground_ias_kt = 20

[Configure Display]
; ROLL DISPLAY (4.5.6.1): fixed_scale = the scale stays put and the pointer turns
; with the horizon (sky pointer); fixed_pointer = the scale turns with the
; horizon and the pointer stays at the top
roll_display = fixed_scale
; AIRSPEED UNITS: knots | mph | kph
airspeed_units = knots
; AIRSPEED MINIMUM (4.5.6.2): below this many knots the airspeed reads 0:
; 20 | 30 | 40
airspeed_minimum = 30
; DISPLAY ORIENTATION (4.5.6.3): auto = from how MD302.obj is placed in Plane
; Maker: roll -90 = VERTICAL RIGHT (knob on the right), +90 = VERTICAL LEFT,
; 0 = HORIZONTAL. horizontal_swap = a horizontal unit with the attitude on the
; right LCD. horizontal | vertical_right | vertical_left are used only when the
; .acf has no MD302.obj slot (the pictures always follow the .acf).
display_orientation = auto
; HORIZON DISPLAY (4.5.6.4): flat | shaded (lighter at the horizon, darker
; toward the edges)
horizon_display = flat

[Configure Heading]
; CONFIGURE HEADING (4.5.7): on = a heading window at the bottom of the attitude
; display, the slip indicator above and to the left of it; off = no heading,
; the slip indicator at the bottom centre. The heading comes from [Sources]
; heading; with none the window shows "---", as the real unit with no heading
; source (figure 4.7). Shipped as pretend: X-Plane's heading.
heading_display = on

[Configure Auto-Off]
; CONFIGURE AUTO-OFF (4.5.8): on = on the ground with aircraft power lost,
; POWER DOWN IN 60 SEC (ON / OFF), then off; off = it stays on the battery
; until POWER OFF in the Options Menu
auto_off = on

[Configure Baro Sync]
; CONFIGURE BARO SYNC (4.5.4): on = the ARINC 429 baro input keeps the MD302's
; baro setting in step with the primary altimeter ([Sources] baro_sync_source);
; the knob still sets it until the primary's changes again
baro_sync = off

[Configure ARINC]
; CONFIGURE ARINC (4.5.3): PASS-THROUGH off | on, TRANSMIT SPEED high | low.
; X-Plane reads no ARINC 429 from the unit: stored and shown in REVIEW CONFIG
arinc_pass_through = off
arinc_speed = high

[Configure Dimming]
; DIMMING CONTROL (4.5.5.1): internal = photocell (X-Plane's ambient light);
; ext_5v | ext_14v | ext_28v = the aircraft lighting bus, read from
; sim/cockpit2/electrical/instrument_brightness_ratio_manual[dimming_rheostat] (0..31:
; the aircraft's panel-light rheostat; 0 with aircraft power lost)
dimming_control = internal
dimming_rheostat = 0
; DIMMING CURVE (4.5.5.2): backlight level % (six values, each 5..100) at 0, 20,
; 40, 60, 80, 100 % of the dimming input; the manual's default is 10 .. 100 in a
; straight line. Internal: the photocell, night (MIN) .. daylight (MAX) on a log
; scale of X-Plane's ambient light, which already brightens and dims the
; screen: the default line gives the look tuned for X-Plane, a point set higher
; or lower makes it that much brighter or darker. External: the bus. The
; pilot's brightness bar (4.3.3) cannot go below the curve's lowest point.
dimming_curve_internal = 10 28 46 64 82 100
dimming_curve_external = 10 28 46 64 82 100
; external only (PT 7, step 6): at or below dimming_low_input % (0..100) of the
; bus the photocell takes over (its curve above); 0 = only with the bus off
dimming_low_input = 0

[Configure Aircraft]
; PANEL TILT (4.5.2.1, -90..90 deg, top of the panel leaning back +) and PANEL
; ROLL (4.5.2.2, -5..5 deg by 0.5): the unit's sensor turns with it and these
; take the mounting out again. auto = what the .acf mounting of MD302.obj needs
; (an installer who measured it right); a number different from that tilts or
; rolls the attitude by the difference, as on a real unit set up wrong.
panel_tilt = auto
panel_roll = auto
; RANGE MMO (4.5.2.3): Mmo (0.000 - 0.999) for a red / white barber pole; 0 = none
range_mmo = 0
; RANGE MARKINGS (4.5.2.4): auto = from the aircraft's V-speeds (Plane Maker):
;   full white Vso-Vs, half white Vso-Vfe, full green Vs-Vno, full yellow Vno-Vne,
;   full red Vne up, as rev Q figure 4.33 example 1 (in the AIRSPEED UNITS above)
; manual = up to 8 rows range1 .. range8 = <TYPE> <CLR> <V1> <V2> as the
;   table of figure 4.33: TYPE FULL | HALF (the right half, over the full
;   bars) | RAD (a radial line at V1) | OFF; CLR WHT | GRN | YEL | RED | BLU |
;   BAR (barber pole: a BAR to MAX makes the barber pole with RANGE MMO and the
;   VNE TABLE, from the lowest of them); V1 V2 in the airspeed units, V2 MAX
;   (or 999) = to the top. Example: FULL WHT 62 68. The words of an older
;   config.ini (F / H, white green ...) are read too.
range_markings = auto
range1 =
range2 =
range3 =
range4 =
range5 =
range6 =
range7 =
range8 =
; VNE TABLE (4.5.2.5): a barber pole from Vne at the altitude: up to 7 points
; "<feet> <speed> ..." (the first at 0 ft, altitudes rising; speeds in the
; AIRSPEED UNITS), joined by lines, the last line on beyond the last point.
; Empty = no table. Example: 0 250 12000 250 17000 230
vne_table =
; SSEC (Static Source Error Correction, 4.5.11): the name of an aircraft's SSEC
; table, shown on the pre-flight screen as "SSEC: FILE <name>"; X-Plane applies
; no correction, the name is all there is. Empty = none (CLEAR SSEC TABLE grey).
ssec_file =

[Sources]
; where the unit's own sensors and its ARINC 429 inputs read X-Plane:
; air data (pitot / static, baro setting): stby = X-Plane's standby system
; (altitude_ft_stby, airspeed_kts_stby, barometer_setting_in_hg_stby; standby
; pitot / static failures apply) | pilot | copilot
air_data = stby
; attitude: own = the aircraft's attitude (the MD302's own solid-state AHRS) |
; ahrs | electric | vacuum (the pilot-side X-Plane instrument of that type)
attitude = own
; the ARINC 429 baro input for CONFIGURE BARO SYNC: pilot | copilot (that
; side's X-Plane altimeter setting)
baro_sync_source = pilot
; heading (4.3.1.2): what feeds the heading window
;   pretend = X-Plane's heading, always available while the unit has power.
;             A plug-and-use convenience, not a real MD302 configuration: a
;             real unit shows "---" until an MD32 or an ARINC 429 heading is
;             wired.
;   none    = no heading source ("---"), as a real unit with none wired
;   md32    = an MD32 remote magnetometer (X-Plane's magnetic heading)
;   arinc   = ARINC 429 labels 014 / 320 from the aircraft's AHRS (the pilot's
;             AHRS heading in X-Plane): follows aircraft power and failures
heading = pretend

[Display]
; one device framebuffer over the whole MD302 texture (2 x its 1024 px), so
; each LCD is 500 x 374 px; LCD origins in it (y up), as 3D/MD302.obj maps them
screen_fb = 2048
left_lcd_x = 1400
left_lcd_y = 814
right_lcd_x = 1400
right_lcd_y = 394
; 2D popup with both LCDs: a click on the 3D screens, or the commands
; laminar/md302/popup_show / popup_toggle; closing it destroys the window
enable_popup = 1
popup_initial = 0
; the LCD panels are cheap 320 x 240 TFTs: 1 = draw their look over the picture
; (gone when the unit is off; it stays as at the default brightness when the
; brightness is turned up, dims with the picture when it is turned down),
; 0 = a clean picture
lcd_effects = 1
; the black they show with the backlight on (it leaks through), as the band a TN
; panel shows a little off-axis: nearly black at the top, a neutral grey, a
; green-teal cast at the bottom (Textures/lcd_band.png). 0..1: 1 = as the real
; unit in the 3D cockpit (X-Plane boosts panel light in daylight, about 12x),
; 0 = pure black. The 2D popup is not boosted and looks nearly black
lcd_band = 1
; backlight bleeding round the edges, 0..1 (Textures/lcd_bleed.png)
lcd_bleed = 0.15
; pixel-to-pixel unevenness at the 320 x 240 pitch, 0..1 (Textures/lcd_grain.png)
lcd_grain = 0.1

[Clicks]
; X-Plane only clicks manipulators of the aircraft's ONE cockpit object; MD302.obj
; is attached as an ordinary object, so the plugin picks the knob itself (3D
; cockpit view). 0 = off, 1 = auto (off when X-Plane can already click it), 2 = always
pick_mode = 1
; a click inside the knob rectangle that misses the knob: 0 = swallow, 1 = pass to X-Plane
pick_pass_misses = 0
; 1 = log the click windows and hits to Log.txt
pick_debug = 0
